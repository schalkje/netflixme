<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>netflixme sync</title>
    <style>
      body { font: 13px system-ui, sans-serif; background: #0b0b0f; color: #f5f5f7; margin: 0; padding: 14px; width: 240px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .brand { color: #e50914; }
      #status { color: #9aa0aa; min-height: 32px; }
      #result { color: #6ee7a8; font-size: 12px; margin-top: 6px; min-height: 16px; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 8px; border: 0; border-radius: 7px; font-weight: 600; cursor: pointer; }
      #sync { background: #e50914; color: #fff; }
      #options { background: #26262f; color: #fff; }
    </style>
  </head>
  <body>
    <h1>netflix<span class="brand">me</span> sync</h1>
    <div id="status">…</div>
    <div id="result"></div>
    <div class="row">
      <button id="sync">Sync now</button>
      <button id="options">Options</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
